[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "magnet-learn"
version = "3.0.1"
description = "Fast dimensionality reduction and graph layout (kNN graph, spectral init, attraction/repulsion in C++)"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
authors = [{ name = "Maixent Chenebaux" }]
dependencies = ["numpy", "scipy", "scikit-learn", "tqdm"]

[project.optional-dependencies]
hnsw = ["hnswlib"]
graphs = ["networkx"]
leiden = ["python-igraph"]
clustering = ["hdbscan"]
test = ["pytest", "networkx"]
bench = ["umap-learn", "openTSNE", "pacmap", "trimap", "scikit-learn", "matplotlib", "networkx"]

[project.urls]
Homepage = "https://github.com/kerighan/lib-magnet"
Issues = "https://github.com/kerighan/lib-magnet/issues"

[tool.setuptools]
packages = ["magnet"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-manylinux_i686"
# numpy / scipy ship manylinux_2_28 wheels only: the 2014 image would build them from source in the test step
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest", "networkx"]
test-command = "MAGNET_TEST_INSTALLED=1 pytest -q {project}/tests"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
