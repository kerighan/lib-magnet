[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "magnet-learn"
version = "3.0.0"
description = "Fast dimensionality reduction and graph layout (kNN graph, spectral init, attraction/repulsion in C++)"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Maixent Chenebaux" }]
dependencies = ["numpy", "scipy", "tqdm"]

[project.optional-dependencies]
hnsw = ["hnswlib"]
bench = ["umap-learn", "openTSNE", "pacmap", "trimap", "scikit-learn", "matplotlib", "networkx"]

[project.urls]
Homepage = "https://github.com/kerighan/lib-magnet"

[tool.setuptools]
packages = ["magnet"]
