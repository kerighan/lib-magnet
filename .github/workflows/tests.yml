name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:   # one macOS job: the macOS runners are capacity-limited and the extra jobs kept being cancelled in the queue
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the source distribution and install from it (catches missing headers)
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          python -m pip install dist/*.tar.gz pytest networkx
      - name: Run the tests against the installed package
        run: |
          cd tests && python -m pytest -q
